name: WRF PALMAS V0.6 - GFS mapas com fronteiras

on:
  workflow_dispatch:
    inputs:
      gfs_day:
        description: "GFS UTC day YYYYMMDD. Empty = yesterday. Same day reuses caches."
        required: false
        type: string
        default: ""

  push:
    paths:
      - ".github/workflows/real-gfs-v05.yml"

permissions:
  contents: read

jobs:
  regional-real-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      NETCDF: /usr
      NETCDF_C: /usr
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Instalar NetCDF Fortran e ferramentas do WPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gfortran gcc g++ make m4 csh perl curl netcdf-bin \
            libnetcdf-dev libnetcdff-dev libhdf5-dev libpng-dev zlib1g-dev
          echo "NetCDF-Fortran libraries:"
          nf-config --flibs
          test "$(nf-config --has-nc4)" = yes
          df -h .

      - name: Fixar ciclo GFS para repeticoes e cache
        run: |
          day="${{ inputs.gfs_day }}"
          if [ -z "$day" ]; then day="$(date -u -d yesterday +%Y%m%d)"; fi
          if ! [[ "$day" =~ ^[0-9]{8}$ ]]; then
            echo "::error::Invalid UTC GFS day YYYYMMDD: $day"
            exit 1
          fi
          iso="${day:0:4}-${day:4:2}-${day:6:2}"
          test "$(date -u -d "$iso" +%Y%m%d 2>/dev/null)" = "$day" || {
            echo "::error::Invalid calendar day $day"; exit 1;
          }
          echo "GFS_DAY=$day" >> "$GITHUB_ENV"
          echo "GFS_START=${iso}T12:00" >> "$GITHUB_ENV"
          echo "Using pinned GFS $day 12Z; cache is tied to this cycle"

      - name: Restaurar GFS deste ciclo
        id: gfs-cache
        uses: actions/cache/restore@v4
        with:
          path: gfs
          key: palmas-v05-gfs-${{ env.GFS_DAY }}-12z-subregion-v1

      - name: Baixar GRIB2 regionais NOAA GFS f000 e f003 se necessario
        if: steps.gfs-cache.outputs.cache-hit != 'true'
        run: |
          python3 scripts/download_gfs.py --day "$GFS_DAY" --cycle 12 --out gfs
          du -sh gfs
          file gfs/*

      - name: Verificar dois GRIB antes de aproveitar cache
        run: |
          for h in 000 003; do
            f="gfs/gfs.t12z.pgrb2.0p25.f$h"
            test -s "$f" || { echo "::error::Missing GRIB $f"; exit 1; }
            test "$(head -c 4 "$f")" = GRIB || { echo "::error::Invalid GRIB $f"; exit 1; }
          done

      - name: Guardar GFS para reutilizar com o mesmo ciclo
        if: steps.gfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: gfs
          key: palmas-v05-gfs-${{ env.GFS_DAY }}-12z-subregion-v1

      - name: Recuperar geografia WPS baixa resolucao
        id: geog-cache
        uses: actions/cache/restore@v4
        with:
          path: geog
          key: palmas-v05-wps-geog-lowres-mandatory-v1

      - name: Dados estaticos WPS baixa resolucao para teste
        if: steps.geog-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p geog
          curl -fL --retry 3 --connect-timeout 30 --max-time 900 \
            https://www2.mmm.ucar.edu/wrf/src/wps_files/geog_low_res_mandatory.tar.gz \
            -o geog-min.tar.gz
          tar -xzf geog-min.tar.gz -C geog

      - name: Verificar e selecionar geografia (baixada ou recuperada)
        run: |
          find geog -type d -name topo_gmted2010_5m -print -quit > geog-location.txt
          test -s geog-location.txt || { echo "Geographic topo_gmted2010_5m missing"; exit 1; }
          geogdir="$(realpath "$(dirname "$(head -n 1 geog-location.txt)")")"
          echo "PALMAS_GEOG=$geogdir" >> "$GITHUB_ENV"
          # WPS low-res test bundle must match GEOGRID.TBL's lowres labels.
          for dataset in topo_gmted2010_5m modis_landuse_20class_5m_with_lakes; do
            test -s "$geogdir/$dataset/index" || {
              echo "::error::Missing lowres geography: $geogdir/$dataset/index"
              find "$geogdir" -mindepth 1 -maxdepth 2 -name index | head -n 20
              exit 1
            }
          done
          du -sh geog
          df -h .

      - name: Guardar geografia para os proximos testes
        if: steps.geog-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: geog
          key: palmas-v05-wps-geog-lowres-mandatory-v1

      - name: Baixar WRF 4.8 e WPS 4.7 oficiais
        run: |
          curl -fL --retry 3 \
            https://github.com/wrf-model/WRF/releases/download/v4.8.0/v4.8.0.tar.gz \
            -o WRF.tar.gz
          curl -fL --retry 3 \
            https://github.com/wrf-model/WPS/archive/refs/tags/v4.7.0.tar.gz \
            -o WPS.tar.gz
          mkdir wrf-src wps-src
          tar -xf WRF.tar.gz --strip-components=1 -C wrf-src
          tar -xf WPS.tar.gz --strip-components=1 -C wps-src
          test -f wrf-src/configure && test -f wps-src/configure

      - name: Reutilizar WRF em_real completo quando possivel
        id: real-cache
        uses: actions/cache/restore@v4
        with:
          path: wrf-src
          key: palmas-real-wrf480-ubuntu2404-netcdf-build-v2

      - name: Compilar WRF em_real serial (primeira vez)
        if: steps.real-cache.outputs.cache-hit != 'true'
        working-directory: wrf-src
        run: |
          printf '%s\n' -1 | ./configure arw > ../wrf-options.log 2>&1 || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("../wrf-options.log").read_text()
          for line in text.splitlines():
              if "GNU (gfortran/gcc)" in line:
                  match = re.search(r"\b(\d+)\.\s+\(serial\)", line)
                  if match:
                      Path("../wrf-choice").write_text(match.group(1))
                      print("Selected", line.strip())
                      break
          else:
              print(text[-7000:])
              raise SystemExit("WRF GNU serial option missing")
          PY
          printf '%s\n%s\n' "$(cat ../wrf-choice)" 0 | ./configure arw > ../wrf-configure.log 2>&1
          test -f configure.wrf
          grep -q -- '-lnetcdff' configure.wrf
          start="$(date +%s)"
          ./compile em_real -j 2 > ../wrf-compile.log 2>&1 || {
            tail -n 100 ../wrf-compile.log; exit 1;
          }
          echo "WRF_BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          test -x main/wrf.exe && test -x main/real.exe || {
            tail -n 110 ../wrf-compile.log; exit 1;
          }

      - name: Guardar WRF em_real compilado ANTES do WPS
        if: steps.real-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: wrf-src
          key: palmas-real-wrf480-ubuntu2404-netcdf-build-v2

      - name: Verificar bibliotecas do motor WRF real
        run: |
          test -x wrf-src/main/wrf.exe
          test -x wrf-src/main/real.exe
          test -s wrf-src/external/io_netcdf/libwrfio_nf.a
          test -s wrf-src/external/io_int/libwrfio_int.a
          echo "Full em_real WRF ready"

      - name: Reutilizar WPS compilado quando possivel
        id: wps-cache
        uses: actions/cache/restore@v4
        with:
          path: wps-src
          key: palmas-v05-wps470-wrf480-ubuntu2404-netcdf-grib2-v1

      - name: Compilar WPS geogrid ungrib metgrid
        if: steps.wps-cache.outputs.cache-hit != 'true'
        working-directory: wps-src
        run: |
          export WRF_DIR="$GITHUB_WORKSPACE/wrf-src"
          # WPS 4.7 expects libnetcdff directly in NETCDF/lib,
          # but Ubuntu 24.04 puts it in a multiarch path:
          # /usr/lib/x86_64-linux-gnu. Expose a local compatibility prefix.
          compat="$RUNNER_TEMP/wps-netcdf-compat"
          mkdir -p "$compat/lib"
          ln -sfn /usr/include "$compat/include"
          libdir="$(nf-config --flibs | tr ' ' '\n' | sed -n 's/^-L//p' | head -n 1)"
          test -n "$libdir"
          for lib in netcdff netcdf; do
            source_lib="$libdir/lib$lib.so"
            if ! test -s "$source_lib"; then
              echo "Missing $source_lib"; exit 1
            fi
            ln -sfn "$source_lib" "$compat/lib/lib$lib.so"
          done
          export NETCDF="$compat"
          echo "WPS NetCDF compatibility prefix: $NETCDF"
          printf '%s\n' -1 | ./configure --build-grib2-libs > ../wps-options.log 2>&1 || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("../wps-options.log").read_text()
          for line in text.splitlines():
              if "(serial)" in line and ("gfortran" in line.lower() or "gnu" in line.lower()):
                  match = re.search(r"^\s*(\d+)\.", line)
                  if match:
                      Path("../wps-choice").write_text(match.group(1))
                      print("Selected", line.strip())
                      break
          else:
              print(text[-8000:])
              raise SystemExit("WPS serial GNU option missing")
          PY
          printf '%s\n' "$(cat ../wps-choice)" | ./configure --build-grib2-libs > ../wps-configure.log 2>&1 || {
            tail -n 110 ../wps-configure.log; exit 1;
          }
          test -f configure.wps
          if ! grep -q -- '-lnetcdff' configure.wps; then
            echo "::error::WPS configure.wps missing NetCDF-Fortran linker flag"
            grep -n -E 'WRF_LIB|NETCDF|netcdf' configure.wps | head -n 35
            exit 1
          fi
          grep -n -A 6 '^WRF_LIB' configure.wps | head -n 10
          start="$(date +%s)"
          ./compile > ../wps-compile.log 2>&1 || {
            tail -n 110 ../wps-compile.log; exit 1;
          }
          echo "WPS_BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          for bin in geogrid.exe ungrib.exe metgrid.exe; do
            test -x "$bin" || { echo "Missing WPS binary $bin"; tail -n 100 ../wps-compile.log; exit 1; }
          done

      - name: Guardar WPS compilado ANTES de rodar geogrid
        if: steps.wps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: wps-src
          key: palmas-v05-wps470-wrf480-ubuntu2404-netcdf-grib2-v1

      - name: Verificar WPS apos cache
        run: |
          for exe in geogrid.exe ungrib.exe metgrid.exe; do
            test -x "wps-src/$exe" || {
              echo "::error::Missing cached WPS executable: $exe"; exit 1;
            }
          done

      - name: Restaurar met_em preparado para MESMO ciclo e dominio
        id: met-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            wps-src/met_em.d01.*.nc
          key: palmas-v05-metem-${{ env.GFS_DAY }}-12z-9km-81-lowres-v1

      - name: Calcular geografia e condicoes iniciais GFS
        if: steps.met-cache.outputs.cache-hit != 'true'
        working-directory: wps-src
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/make_namelists.py" \
            --start "$GFS_START" --hours 3 --grid 81 --dx-km 9 \
            --lat -27.3 --lon -52.3 --geog "$PALMAS_GEOG" \
            --out "$GITHUB_WORKSPACE/pilot"
          cp "$GITHUB_WORKSPACE/pilot/namelist.wps" namelist.wps
          grep -Fq "geog_data_res = 'lowres'" namelist.wps || {
            echo "::error::WPS namelist must use the lowres static dataset"
            exit 1
          }
          ln -sfn ungrib/Variable_Tables/Vtable.GFS Vtable
          ./geogrid.exe > "$GITHUB_WORKSPACE/geogrid.log" 2>&1 || {
            tail -n 90 "$GITHUB_WORKSPACE/geogrid.log"; exit 1;
          }
          test -s geo_em.d01.nc
          ./link_grib.csh "$GITHUB_WORKSPACE"/gfs/gfs.t*.pgrb2.0p25.f*
          ./ungrib.exe > "$GITHUB_WORKSPACE/ungrib.log" 2>&1 || {
            tail -n 90 "$GITHUB_WORKSPACE/ungrib.log"; exit 1;
          }
          ./metgrid.exe > "$GITHUB_WORKSPACE/metgrid.log" 2>&1 || {
            tail -n 90 "$GITHUB_WORKSPACE/metgrid.log"; exit 1;
          }
          ls -lh met_em.d01.*.nc

      - name: Verificar os met_em que alimentam real.exe
        run: |
          test -s "wps-src/met_em.d01.${GFS_START/T/_}:00.nc"
          echo "Found first met_em for $GFS_START"
          ls -lh wps-src/met_em.d01.*.nc

      - name: Guardar met_em ANTES do real.exe
        if: steps.met-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            wps-src/met_em.d01.*.nc
          key: palmas-v05-metem-${{ env.GFS_DAY }}-12z-9km-81-lowres-v1

      - name: Iniciar meteorologia real com real.exe
        working-directory: wrf-src/test/em_real
        run: |
          export FIRST_MET_EM="$(python3 - <<'PY'
          import os
          from pathlib import Path
          start = os.environ["GFS_START"].replace("T", "_") + ":00"
          path = Path(os.environ["GITHUB_WORKSPACE"]) / "wps-src" / ("met_em.d01." + start + ".nc")
          if not path.is_file(): raise SystemExit(f"Missing met_em file: {path}")
          print(path)
          PY
          )"
          python3 "$GITHUB_WORKSPACE/scripts/make_namelists.py" \
            --start "$GFS_START" --hours 3 --grid 81 --dx-km 9 \
            --lat -27.3 --lon -52.3 --geog "$PALMAS_GEOG" \
            --met-em "$FIRST_MET_EM" --out "$GITHUB_WORKSPACE/pilot"
          cp "$GITHUB_WORKSPACE/pilot/namelist.input" namelist.input
          ln -sfn ../../main/real.exe real.exe
          ln -sfn ../../main/wrf.exe wrf.exe
          ln -sf "$GITHUB_WORKSPACE"/wps-src/met_em.d01.*.nc ./
          ulimit -s unlimited
          start="$(date +%s)"
          ./real.exe > "$GITHUB_WORKSPACE/real.log" 2>&1 || {
            tail -n 110 "$GITHUB_WORKSPACE/real.log"; exit 1;
          }
          echo "REAL_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          test -s wrfinput_d01 && test -s wrfbdy_d01

      - name: Simular tres horas com GFS
        working-directory: wrf-src/test/em_real
        run: |
          ulimit -s unlimited
          start="$(date +%s)"
          /usr/bin/time -v -o "$GITHUB_WORKSPACE/wrf-real-resources.txt" \
            ./wrf.exe > "$GITHUB_WORKSPACE/wrf-real.log" 2>&1 || {
            tail -n 110 "$GITHUB_WORKSPACE/wrf-real.log"; exit 1;
          }
          echo "WRF_REAL_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          grep -q "SUCCESS COMPLETE WRF" "$GITHUB_WORKSPACE/wrf-real.log" || \
            grep -q "SUCCESS COMPLETE WRF" rsl.out.0000 || {
              tail -n 90 "$GITHUB_WORKSPACE/wrf-real.log"; exit 1;
            }
          ls -lh wrfout_d01_*

      - name: Guardar wrfout bruto em artefato independente ANTES dos mapas
        uses: actions/upload-artifact@v4
        with:
          name: WRF-PALMAS-V06-WRFOUT-RAW
          path: wrf-src/test/em_real/wrfout_d01_*
          if-no-files-found: error
          retention-days: 7

      - name: Guardar wrfout para replotagens futuras
        uses: actions/cache/save@v4
        with:
          path: wrf-src/test/em_real/wrfout_d01_*
          key: palmas-v06-wrfout-${{ env.GFS_DAY }}-12z-9km-81-lowres-30min-v1

      - name: Plotar V0.6 com mapa, fronteiras, cidades, chuva, GIF
        run: |
          python3 -m pip install --user --break-system-packages numpy netCDF4 matplotlib pillow cartopy
          python3 scripts/plot_real_v06.py --run-dir wrf-src/test/em_real --out-dir results/v06
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder = Path("results/v06")
          result = json.loads((folder/"summary.json").read_text())
          assert result["num_times"] == 7, result["num_times"]
          for name in ("t2", "rain"):
              assert (folder/"gifs"/(name+"_anim.gif")).stat().st_size > 1024
          print(result["gif_products"], result["unavailable"])
          PY

      - name: Relatorio de tempos
        if: always()
        run: |
          echo "# WRF PALMAS V0.5 | Piloto GFS real" > v05-report.txt
          echo "Dataset: GFS ($GFS_DAY 12Z), 9km, 3h" >> v05-report.txt
          echo "WRF build (sec): $WRF_BUILD_SECONDS" >> v05-report.txt
          echo "WPS build (sec): $WPS_BUILD_SECONDS" >> v05-report.txt
          echo "real.exe (sec): $REAL_SECONDS" >> v05-report.txt
          echo "wrf.exe (sec): $WRF_REAL_SECONDS" >> v05-report.txt
          echo "LOW RES STATIC GEOGRAPHY: benchmark only, not operational" >> v05-report.txt
          cat v05-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar V0.6 ou diagnostico de falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WRF-PALMAS-V06-MAPAS-GFS
          path: |
            results/v06/
            v05-report.txt
            pilot/
            wrf-options.log
            wrf-configure.log
            wrf-compile.log
            wps-options.log
            wps-configure.log
            wps-compile.log
            geogrid.log
            ungrib.log
            metgrid.log
            real.log
            wrf-real.log
            wrf-real-resources.txt
            wps-src/geogrid.log.0000
            wps-src/metgrid.log.0000
            wrf-src/test/em_real/rsl.error.0000
          retention-days: 7
          if-no-files-found: warn
