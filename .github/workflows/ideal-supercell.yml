name: WRF PALMAS V0.4 - triplo painel e paleta radar

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Duracao meteorologica do teste"
        required: true
        default: "120"
        type: choice
        options: ["30", "60", "120", "180"]
      grid_points:
        description: "Pontos horizontais por lado (2 km)"
        required: true
        default: "122"
        type: choice
        options: ["42", "82", "122", "162"]
      history_minutes:
        description: "Intervalo entre mapas"
        required: true
        default: "15"
        type: choice
        options: ["10", "15", "30"]
  push:
    paths:
      - ".github/workflows/ideal-supercell.yml"

permissions:
  contents: read

jobs:
  ideal-supercell:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      NETCDF: /usr
      NETCDF_C: /usr
      PALMAS_DURATION: ${{ inputs.duration_minutes || '120' }}
      PALMAS_GRID: ${{ inputs.grid_points || '122' }}
      PALMAS_HISTORY: ${{ inputs.history_minutes || '15' }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar bibliotecas cientificas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran gcc g++ make m4 csh perl curl \
            libnetcdf-dev libnetcdff-dev netcdf-bin libhdf5-dev zlib1g-dev
          nf-config --version
          echo "NetCDF Fortran linker flags:"
          nf-config --flibs
          nc-config --libs
          test "$(nf-config --has-nc4)" = yes

      - name: Baixar o codigo-fonte oficial WRF 4.8.0
        run: |
          curl -fL --retry 3 "https://github.com/wrf-model/WRF/releases/download/v4.8.0/v4.8.0.tar.gz" -o wrf.tar.gz
          mkdir -p wrf-src
          tar -xf wrf.tar.gz --strip-components=1 -C wrf-src
          test -f wrf-src/configure

      - name: Reutilizar compilacao anterior quando disponivel
        id: compiled-cache
        uses: actions/cache@v4
        with:
          path: |
            wrf-src/main/wrf.exe
            wrf-src/main/ideal.exe
          # Cache only executable files, NOT large WRF build trees.
          # Bump key after compiler, system library or WRF source changes.
          key: wrf-palmas-480-ubuntu2404-gfortran-netcdf4-ideal-serial-v1

      - name: Configurar GNU serial para caso idealizado
        working-directory: wrf-src
        run: |
          printf '%s\n' '-1' | ./configure arw > ../configure-options.log 2>&1 || true
          python3 - <<'PY'
          import pathlib, re
          s = pathlib.Path("../configure-options.log").read_text()
          for line in s.splitlines():
              if "GNU (gfortran/gcc)" in line:
                  m = re.search(r"\b(\d+)\.\s+\(serial\)", line)
                  if m:
                      pathlib.Path("../compiler-choice.txt").write_text(m.group(1))
                      print("Chosen:", line.strip())
                      break
          else:
              print(s[-9000:])
              raise SystemExit("GNU serial not found in WRF configuration")
          PY
          choice="$(cat ../compiler-choice.txt)"
          printf '%s\n%s\n' "$choice" '0' | ./configure arw > ../configure.log 2>&1
          test -f configure.wrf || { tail -n 100 ../configure.log; exit 1; }
          # NetCDF4 linking is required; classic mode previously lost libnetcdff.
          if ! grep -q -- '-lnetcdff' configure.wrf; then
            echo "::error::NetCDF-Fortran link flags missing in configure.wrf"
            grep -n -E "NETCDF|LIB_LOCAL|LIB_EXTERNAL" configure.wrf | tail -n 35
            exit 1
          fi

      - name: Compilar WRF apenas se nao houver cache
        if: steps.compiled-cache.outputs.cache-hit != 'true'
        working-directory: wrf-src
        run: |
          start="$(date +%s)"
          if ! ./compile em_quarter_ss -j 2 > ../compile.log 2>&1; then
            tail -n 130 ../compile.log
            exit 1
          fi
          echo "build_elapsed_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          # WRF's compile can exit 0 even when the linker failed (ignored make errors).
          # Every binary must be present and executable; do not use && in shell -e guard.
          if ! test -x main/wrf.exe || ! test -x main/ideal.exe; then
            echo "::error::WRF executables missing - inspect real link error below"
            grep -E -m 15 'undefined reference|collect2: error|No such file|Problems building' ../compile.log || true
            tail -n 70 ../compile.log
            exit 1
          fi
          test -x test/em_quarter_ss/wrf.exe
          test -x test/em_quarter_ss/ideal.exe
          echo "Link succeeded - both executable binaries exist."
          tail -n 30 ../compile.log

      - name: Conferir executaveis e preparar atalhos
        working-directory: wrf-src
        run: |
          if [ "${{ steps.compiled-cache.outputs.cache-hit }}" = "true" ]; then
            echo "build_elapsed_seconds=0" >> "$GITHUB_ENV"
          fi
          test -x main/wrf.exe
          test -x main/ideal.exe
          ln -sfn ../../main/wrf.exe test/em_quarter_ss/wrf.exe
          ln -sfn ../../main/ideal.exe test/em_quarter_ss/ideal.exe
          test -x test/em_quarter_ss/wrf.exe
          test -x test/em_quarter_ss/ideal.exe
          echo "Executables verified; cache restored: ${{ steps.compiled-cache.outputs.cache-hit }}"

      - name: Inicializar e rodar supercelula idealizada
        working-directory: wrf-src/test/em_quarter_ss
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/prepare_ideal.py" \
            --namelist namelist.input \
            --duration "$PALMAS_DURATION" \
            --grid "$PALMAS_GRID" \
            --history "$PALMAS_HISTORY"
          start="$(date +%s)"
          if ! ./ideal.exe > "$GITHUB_WORKSPACE/ideal.log" 2>&1; then
            tail -n 100 "$GITHUB_WORKSPACE/ideal.log"
            exit 1
          fi
          test -s wrfinput_d01
          echo "ideal_elapsed_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          start="$(date +%s)"
          if ! /usr/bin/time -v -o "$GITHUB_WORKSPACE/wrf-resources.txt" \
                  ./wrf.exe > "$GITHUB_WORKSPACE/integration.log" 2>&1; then
            tail -n 100 "$GITHUB_WORKSPACE/integration.log"
            tail -n 100 rsl.error.0000 2>/dev/null || true
            exit 1
          fi
          echo "integration_elapsed_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          if ! ( grep -q "SUCCESS COMPLETE WRF" "$GITHUB_WORKSPACE/integration.log" ||
                 grep -q "SUCCESS COMPLETE WRF" rsl.out.0000 ); then
            tail -n 80 "$GITHUB_WORKSPACE/integration.log"
            exit 1
          fi
          ls -lh wrfout_d01_*

      - name: Produzir W, vorticidade e painel radar V0.4
        run: |
          python3 -m pip install --user --break-system-packages netCDF4 numpy matplotlib
          python3 scripts/plot_ideal.py --run-dir wrf-src/test/em_quarter_ss --out-dir results/ideal-supercell
          python3 scripts/diagnostics_v03.py --run-dir wrf-src/test/em_quarter_ss --out-dir results/ideal-supercell/v03
          python3 scripts/plot_v04.py --run-dir wrf-src/test/em_quarter_ss --out-dir results/ideal-supercell/v04
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path("results/ideal-supercell/summary.json").read_text())
          duration = int(os.environ["PALMAS_DURATION"])
          assert d["frame_count"] >= 2, f"Only {d['frame_count']} frame(s)"
          assert d["simulated_minutes"] == duration, (d["simulated_minutes"], duration)
          v03 = json.loads(Path("results/ideal-supercell/v03/diagnostics_summary.json").read_text())
          assert v03["frame_count"] == d["frame_count"], (v03["frame_count"], d["frame_count"])
          assert v03["simulated_minutes"] == duration
          assert Path("results/ideal-supercell/v03/v03_vorticidade_e_chuva.gif").stat().st_size > 1000
          v04_dir = Path("results/ideal-supercell/v04")
          v04 = json.loads((v04_dir / "summary_v04.json").read_text())
          assert v04["frame_count"] == d["frame_count"], (v04["frame_count"], d["frame_count"])
          assert v04["simulated_minutes"] == duration, (v04["simulated_minutes"], duration)
          # WRF e_we/e_sn include the staggered boundary; WRF mass fields have N-1.
          expected_mass_grid = int(os.environ["PALMAS_GRID"]) - 1
          assert v04["grid_cells"] == [expected_mass_grid]*2, (
              "WRF mass-grid dimensions", v04["grid_cells"],
              "expected", [expected_mass_grid]*2,
          )
          assert (v04_dir / "wrf_palmas_v04_triplo.gif").stat().st_size > 1000
          assert len(list(v04_dir.glob("palmas_v04_t*.png"))) == d["frame_count"]
          print("V0.4 validated:", d["frame_count"], "frames,", duration,
                "minutes simulated, grid", v04["grid_cells"])
          PY

      - name: Registrar tempos
        if: always()
        run: |
          echo "# WRF PALMAS V0.4 - paleta radar e painel triplo" > test-report.txt
          echo "WRF 4.8.0 / em_quarter_ss / 2km / ${PALMAS_GRID}x${PALMAS_GRID} / ${PALMAS_DURATION} minutos meteorologicos" >> test-report.txt
          echo "Cache WRF: ${{ steps.compiled-cache.outputs.cache-hit }}" >> test-report.txt
          echo "History interval (min): $PALMAS_HISTORY" >> test-report.txt
          echo "Compilacao (segundos): $build_elapsed_seconds" >> test-report.txt
          echo "Inicializador (segundos): $ideal_elapsed_seconds" >> test-report.txt
          echo "Integracao WRF (segundos): $integration_elapsed_seconds" >> test-report.txt
          echo "NAO e previsao real ou operacional da America do Sul." >> test-report.txt
          cat test-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Anexar mapas e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WRF-PALMAS-v0-4-supercelula
          path: |
            results/ideal-supercell/
            test-report.txt
            configure-options.log
            configure.log
            compile.log
            wrf-src/configure.wrf
            wrf-resources.txt
            ideal.log
            integration.log
            wrf-src/test/em_quarter_ss/rsl.error.0000
          retention-days: 7
          if-no-files-found: warn
